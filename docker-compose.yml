services:
  uptime-kuma:
    image: louislam/uptime-kuma:1
    container_name: uptime-kuma
    ports:
      - "3001:3001"
    volumes:
      - uptime-kuma-data:/app/data
    restart: unless-stopped
    networks:
      - shared-net 
      - default
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.kuma.rule=Host(`kuma.home.local`)"
      - "traefik.http.services.kuma.loadbalancer.server.port=3001"  
networks:
  shared-net: 
    external: true
volumes:
  uptime-kuma-data: