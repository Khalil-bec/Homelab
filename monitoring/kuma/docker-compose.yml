services:
  uptime-kuma:
    image: louislam/uptime-kuma:1
    container_name: uptime-kuma
    ports:
      - "3001:3001"
    volumes:
      - uptime-kuma-data:/app/data
    restart: unless-stopped
    networks:
      - shared-net 
      - default
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=shared-net"
      - "traefik.http.routers.kuma.rule=Host(`kuma.homelab.lab`)"
      - "traefik.http.routers.kuma.entrypoints=websecure"
      - "traefik.http.routers.kuma.tls=true"
      - "traefik.http.services.kuma.loadbalancer.server.port=3001"
    extra_hosts:
      - "grafana.homelab.lab:host-gateway"
      - "prometheus.homelab.lab:host-gateway"
      - "traefik.homelab.lab:host-gateway"
networks:
  shared-net: 
    external: true
volumes:
  uptime-kuma-data: